# Xcode project spec for the Compose Multiplatform iOS app.
# Regenerate the .xcodeproj with:  cd iosApp && xcodegen generate
name: iosApp
options:
  bundleIdPrefix: com.bakery.customer
  deploymentTarget:
    iOS: "15.0"
  createIntermediateGroups: true

settings:
  base:
    # Allow the gradle pre-build script to write the embedded framework.
    ENABLE_USER_SCRIPT_SANDBOXING: NO

targets:
  iosApp:
    type: application
    platform: iOS
    sources:
      - path: iosApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bakery.customer.app
        PRODUCT_NAME: Bakery
        INFOPLIST_FILE: iosApp/Info.plist
        # Where the KMP plugin drops the framework for Xcode consumption.
        FRAMEWORK_SEARCH_PATHS:
          - $(inherited)
          - $(SRCROOT)/../composeApp/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)
        OTHER_LDFLAGS:
          - $(inherited)
          - -framework
          - ComposeApp
    preBuildScripts:
      - name: Compile Kotlin Framework
        basedOnDependencyAnalysis: false
        script: |
          set -e
          cd "$SRCROOT/.."
          ./gradlew :composeApp:embedAndSignAppleFrameworkForXcode
